name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64, Static CRT /MT)
        run: cmake -S . -B build -A x64

      - name: Build Release (x64)
        run: cmake --build build --config Release --parallel

      - name: Run Unit & Leak Stress Tests (Release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Standalone CLI Leak Self-Test
        run: |
          $proc = Start-Process -FilePath ".\build\Release\SayCheese.exe" -ArgumentList "--self-test-leaks" -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "SayCheese.exe --self-test-leaks failed with exit code $($proc.ExitCode)"
          }

      - name: Package Portable Artifact & SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/SayCheese.exe" "dist/SayCheese.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/SayCheese.exe").Hash.ToLowerInvariant()
          "$hash  SayCheese.exe" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Get-Content "dist/SHA256SUMS.txt"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SayCheese.exe
            dist/SHA256SUMS.txt
